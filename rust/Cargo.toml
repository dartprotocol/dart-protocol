[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.0"
byteorder = "1.5.0"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib"] }
hmac = "0.13.0"
p256 = { version = "0.14.0", features = ["ecdh"] }
rand = "0.10.2"
rand_core = "0.10.1"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.20.1"
futures-util = "0.3.30"
