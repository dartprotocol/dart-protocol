name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/*.exe
          if-no-files-found: error

  go:
    name: Go binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - name: Build cross-platform binaries
        working-directory: go
        run: |
          set -e
          mkdir -p ../out
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -o "../out/dart-server-${os}-${arch}${ext}" ./server
            GOOS=$os GOARCH=$arch go build -o "../out/dart-cli-${os}-${arch}${ext}" .
          done
          ls -l ../out
      - uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: out/*

  rust:
    name: Rust binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release
      - name: Stage binaries
        run: |
          mkdir -p ../out
          cp target/release/client ../out/dart-client-linux-amd64
          cp target/release/server ../out/dart-server-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: rust-binaries
          path: out/*

  release:
    name: Publish release
    needs: [desktop, go, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -lR artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
