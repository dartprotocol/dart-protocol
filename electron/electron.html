<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dart</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #111;
            --line: rgba(255,255,255,0.1);
            --text: #ededed;
            --muted: #8a8a8a;
            --me: #6ee7b7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .titlebar {
            -webkit-app-region: drag;
            height: 32px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 12px;
            color: var(--muted);
            border-bottom: 1px solid var(--line);
        }
        .bar {
            -webkit-app-region: no-drag;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }
        label { color: var(--muted); font-size: 11px; }
        input, select, button {
            -webkit-app-region: no-drag;
            font: inherit;
            color: var(--text);
            background: #000;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 5px 8px;
        }
        input#host { width: 180px; }
        input#room { width: 56px; }
        button {
            cursor: pointer;
            background: #fff;
            color: #000;
            border-color: #fff;
            font-weight: 500;
        }
        button.ghost {
            background: transparent;
            color: var(--text);
            border-color: var(--line);
        }
        button:disabled { opacity: 0.4; cursor: default; }
        #status { font-size: 11px; color: var(--muted); margin-left: auto; }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
        }
        .sys { color: var(--muted); margin: 4px 0; }
        .msg { margin: 3px 0; white-space: pre-wrap; word-break: break-word; }
        .msg.me { color: var(--me); }
        .composer {
            display: flex;
            gap: 6px;
            padding: 8px 10px;
            border-top: 1px solid var(--line);
            background: var(--panel);
        }
        .composer input { flex: 1; }
    </style>
</head>
<body>
    <div class="titlebar">Dart</div>
    <div class="bar">
        <label for="host">Server</label>
        <input id="host" type="text" value="daebak.init3.ro" spellcheck="false" />
        <label for="transport">Via</label>
        <select id="transport">
            <option value="udp" selected>UDP 9000</option>
            <option value="ws">WebSocket</option>
        </select>
        <label for="room">Room</label>
        <input id="room" type="number" value="1" min="1" max="65535" />
        <button id="joinBtn">Join</button>
        <span id="status">id —</span>
    </div>
    <div id="chat"></div>
    <div class="composer">
        <input id="msgInput" type="text" placeholder="Message…" disabled />
        <button id="sendBtn" disabled>Send</button>
    </div>
    <script>require('../src/electron-gui.js');</script>
</body>
</html>
