<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dart Protocol | Live Web Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .demo-container {
            max-width: 900px;
            margin: 8rem auto 4rem;
            padding: 0 2rem;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }
        .app-header h1 {
            font-size: 1.5rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .app-header .client-info {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        
        .chat-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .chat-layout { grid-template-columns: 1fr; }
        }

        .chat-main {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .room-controls {
            display: flex;
            gap: 1rem;
            background: var(--bg-card);
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            align-items: center;
            flex-wrap: wrap;
        }

        .room-controls input {
            background: #0d0d12;
            border: 1px solid var(--border);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-family: 'Fira Code', monospace;
            width: 100px;
        }

        #chat {
            background: #0d0d12;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            height: 450px;
            overflow-y: auto;
            padding: 1.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .msg {
            color: var(--text-main);
        }
        
        .msg strong {
            color: #a491ff;
        }

        .msg.me strong {
            color: #10b981;
        }

        .sys-msg {
            color: var(--text-muted);
            text-align: center;
            font-style: italic;
            font-size: 0.85rem;
            margin: 0.5rem 0;
        }

        .input-group {
            display: flex;
            gap: 1rem;
        }

        .input-group input {
            flex-grow: 1;
            background: #0d0d12;
            border: 1px solid var(--border);
            color: white;
            padding: 1rem;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-family: inherit;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .input-group input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .sidebar-stats {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            height: fit-content;
        }

        .sidebar-stats h3 {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .stat-row span:last-child {
            color: #a491ff;
            font-family: 'Fira Code', monospace;
            font-weight: 600;
        }

        .badge-ws {
            background: rgba(49, 120, 198, 0.15);
            color: #4facfe;
            border: 1px solid rgba(79, 172, 254, 0.3);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Custom scrollbar for chat */
        #chat::-webkit-scrollbar { width: 8px; }
        #chat::-webkit-scrollbar-track { background: transparent; }
        #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        #chat::-webkit-scrollbar-thumb:hover { background: #383846; }

        @media (max-width: 600px) {
            .demo-container { margin-top: 6rem; padding: 0 1rem; }
            .app-header h1 { font-size: 1.2rem; flex-wrap: wrap; }
            .input-group { flex-direction: column; }
            .input-group .btn { width: 100%; }
            .room-controls input { width: 90px; }
        }
    </style>
</head>
<body>
    <div class="bg-fx">
        <div class="glow glow-1"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.75rem;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
                </svg>
                <span>Dart</span> Protocol
            </a>
        </div>
        <input type="checkbox" id="nav-toggle" class="nav-toggle" />
        <label for="nav-toggle" class="nav-toggle-btn" aria-label="Toggle navigation"><span></span><span></span><span></span></label>
        <div class="nav-links">
            <a href="index.html">← Back to Presentation</a>
        </div>
    </nav>

    <div class="demo-container">
        <div class="app-header">
            <h1>Web Client <span class="badge-ws">TCP / WebSocket Bridge</span> <span class="badge-ws" style="background: rgba(16,185,129,0.15); color: #10b981; border-color: rgba(16,185,129,0.3);">E2EE · Blind Relay</span></h1>
            <div class="client-info">
                <span>Client ID: <strong id="myClientId" style="color: #a491ff; font-family: 'Fira Code', monospace;">---</strong></span>
            </div>
        </div>

        <div class="chat-layout">
            <div class="chat-main">
                <div class="room-controls">
                    <label for="roomInput" style="color: var(--text-muted); font-weight: 500;">Room ID</label>
                    <input type="number" id="roomInput" value="1" min="1" max="65535" />
                    <button id="joinBtn" class="btn btn-primary btn-sm">Join Room</button>
                    <button id="reconnectBtn" class="btn btn-secondary btn-sm" style="margin-left: auto;">Reconnect Transport</button>
                </div>

                <div id="chat">
                    <div class="sys-msg">Initializing Dart WebSocket Client...</div>
                </div>
                
                <div class="input-group">
                    <input type="text" id="msgInput" placeholder="Type a message to send over the protocol..." disabled />
                    <button id="sendBtn" class="btn btn-primary" disabled>
                        Send Dart
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="sidebar-stats">
                <h3>Live Telemetry</h3>
                <div class="stat-row">
                    <span>Packets Sent</span>
                    <span id="pktsSent">0</span>
                </div>
                <div class="stat-row">
                    <span>Bytes Transmitted</span>
                    <span id="bytesSent">0</span>
                </div>
                <div class="stat-row">
                    <span>NACKs Issued</span>
                    <span id="nacksSent">0</span>
                </div>
                <div class="stat-row">
                    <span>Cache Retransmits</span>
                    <span id="retransmits">0</span>
                </div>
                
                <div style="margin-top: 3rem; text-align: center;">
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem;">Testing against native clients?</p>
                    <a href="DartProtocol-Win64.exe" class="btn btn-secondary btn-sm" style="width: 100%; justify-content: center;">
                        ⬇️ Download Win64 Client
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- The original javascript logic drives this UI -->
    <script src="app.js?v=21"></script>
    <script src="js/main.js"></script>
</body>
</html>
